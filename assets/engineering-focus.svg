<svg xmlns="http://www.w3.org/2000/svg" width="900" height="312" viewBox="0 0 900 312" role="img" aria-label="Engineering focus: full-stack apps, backend and APIs, databases, creative side">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05080b"/><stop offset=".55" stop-color="#08110f"/><stop offset="1" stop-color="#110a22"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".2"/><stop offset=".5" stop-color="#a7f3d0" stop-opacity=".2"/><stop offset="1" stop-color="#10b981" stop-opacity=".26"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="mintline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a7f3d0"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9cdea"/></linearGradient><clipPath id="c"><rect width="900" height="312" rx="26"/></clipPath>
  <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#10b981" stop-opacity=".14"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></radialGradient></defs>
  <style>.in{animation:in .8s cubic-bezier(.2,.7,.2,1) backwards}@keyframes in{from{opacity:0;transform:translateY(10px)}}.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) .3s backwards}@keyframes grow{from{transform:scaleX(0)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <g clip-path="url(#c)"><rect width="900" height="312" fill="url(#bg)"/><rect width="900" height="312" fill="url(#glow)"/></g>
  <rect x=".75" y=".75" width="898.5" height="310.5" rx="25.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
