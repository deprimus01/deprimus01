  <rect class="grow" x="28" y="68" width="76" height="3" rx="1.5" fill="url(#mintline)"/>
  <text x="872" y="58" text-anchor="end" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8b949e">build / learn / ship</text>
