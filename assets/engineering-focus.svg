<svg xmlns="http://www.w3.org/2000/svg" width="640" height="584" viewBox="0 0 640 584" role="img" aria-label="Engineering focus: full-stack apps, backend and APIs, databases, creative side">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05080b"/><stop offset=".55" stop-color="#08110f"/><stop offset="1" stop-color="#110a22"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".2"/><stop offset=".5" stop-color="#a7f3d0" stop-opacity=".2"/><stop offset="1" stop-color="#10b981" stop-opacity=".26"/></linearGradient>
    <linearGradient id="mintline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a7f3d0"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#34d399" stop-opacity=".15"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="640" height="584" rx="26"/></clipPath>
  </defs>
  <style>.in{animation:in .8s cubic-bezier(.2,.7,.2,1) backwards}@keyframes in{from{opacity:0;transform:translateY(8px)}}.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) .3s backwards}@keyframes grow{from{transform:scaleX(0)}}.dot{animation:p 2.2s ease-in-out infinite}@keyframes p{50%{opacity:.35}}.border{animation:trace 12s linear infinite}@keyframes trace{to{stroke-dashoffset:-100}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <g clip-path="url(#c)"><rect width="640" height="584" fill="url(#bg)"/><rect width="640" height="584" fill="url(#glow)"/></g>
  
  <rect x=".75" y=".75" width="638.5" height="582.5" rx="25.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<text x="32" y="64" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="36" font-weight="700" fill="#f4f6fb">Engineering focus</text><rect class="grow" x="32" y="76" width="84" height="4" rx="2" fill="url(#mintline)"/><g class="in" style="animation-delay:0.10s"><rect x="32" y="108" width="290" height="214" rx="22" fill="#090f12" stroke="#34d399" stroke-opacity=".5" stroke-width="1.4"/><rect x="54" y="130" width="52" height="52" rx="15" fill="#0b1b18" stroke="#34d399" stroke-opacity=".55"/><g transform="translate(67,143) scale(1.1667)" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 17l9 5 9-5"/></g><text x="54" y="216" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#f4f6fb">Full-Stack Apps</text><text x="54" y="250" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#c3cdda">React and Next.js</text><text x="54" y="277" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#c3cdda">frontends with Node.js</text><text x="54" y="304" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#c3cdda">and Express backends.</text></g><g class="in" style="animation-delay:0.22s"><rect x="338" y="108" width="290" height="214" rx="22" fill="#090f12" stroke="#a78bfa" stroke-opacity=".5" stroke-width="1.4"/><rect x="360" y="130" width="52" height="52" rx="15" fill="#0b1b18" stroke="#a78bfa" stroke-opacity=".55"/><g transform="translate(373,143) scale(1.1667)" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.4"/><circle cx="5" cy="5" r="1.9"/><circle cx="19" cy="5" r="1.9"/><circle cx="5" cy="19" r="1.9"/><circle cx="19" cy="19" r="1.9"/><path d="M6.4 6.4 10.3 10.3M17.6 6.4 13.7 10.3M6.4 17.6 10.3 13.7M17.6 17.6 13.7 13.7"/></g><text x="360" y="216" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#f4f6fb">Backend and APIs</text><text x="360" y="250" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#c3cdda">Learning API design,</text><text x="360" y="277" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#c3cdda">authentication and</text><text x="360" y="304" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#c3cdda">backend architecture.</text></g><g class="in" style="animation-delay:0.34s"><rect x="32" y="338" width="290" height="214" rx="22" fill="#090f12" stroke="#34d399" stroke-opacity=".5" stroke-width="1.4"/><rect x="54" y="360" width="52" height="52" rx="15" fill="#0b1b18" stroke="#34d399" stroke-opacity=".55"/><g transform="translate(67,373) scale(1.1667)" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></g><text x="54" y="446" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#f4f6fb">Databases</text><text x="54" y="480" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#c3cdda">PostgreSQL and SQLite,</text><text x="54" y="507" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#c3cdda">with Prisma, for real</text><text x="54" y="534" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#c3cdda">application data.</text></g><g class="in" style="animation-delay:0.46s"><rect x="338" y="338" width="290" height="214" rx="22" fill="#090f12" stroke="#a78bfa" stroke-opacity=".5" stroke-width="1.4"/><rect x="360" y="360" width="52" height="52" rx="15" fill="#0b1b18" stroke="#a78bfa" stroke-opacity=".55"/><g transform="translate(373,373) scale(1.1667)" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9.5v5l4.5-2.5z"/></g><text x="360" y="446" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#f4f6fb">Creative Side</text><text x="360" y="480" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#c3cdda">Video editing and</text><text x="360" y="507" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#c3cdda">visual design</text><text x="360" y="534" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#c3cdda">alongside the code.</text></g>
</svg>
