lay','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16.5" font-weight="700" fill="#f4f6fb">Backend and APIs</text><text x="262" y="238" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b949e">Learning API design,</text><text x="262" y="257" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b949e">authentication and</text><text x="262" y="276" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b949e">backend architecture.</text></g><g class="in" style="animation-delay:0.39s"><rect x="456" y="100" width="202" height="188" rx="20" fill="#090f12" stroke="#34d399" stroke-opacity=".45" stroke-width="1.4"/><rect x="476" y="120" width="54" height="54" rx="15" fill="#0b1b18" stroke="#34d399" stroke-opacity=".55"/><g transform="translate(489,133) scale(1.1667)" fill="none" stroke="#34d399" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"/><path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></g><text x="478" y="210" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16.5" font-weight="700" fill="#f4f6fb">Databases</text><text x="478" y="238" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b949e">PostgreSQL and SQLite</text><text x="478" y="257" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b949e">for real application</text><text x="478" y="276" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b949e">data.</text></g><g class="in" style="animation-delay:0.51s"><rect x="672" y="100" width="202" height="188" rx="20" fill="#090f12" stroke="#a78bfa" stroke-opacity=".45" stroke-width="1.4"/><rect x="692" y="120" width="54" height="54" rx="15" fill="#0b1b18" stroke="#a78bfa" stroke-opacity=".55"/><g transform="translate(705,133) scale(1.1667)" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9.5v5l4.5-2.5z"/></g><text x="694" y="210" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16.5" font-weight="700" fill="#f4f6fb">Creative Side</text><text x="694" y="238" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b949e">Video editing and</text><text x="694" y="257" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b949e">visual design</text><text x="694" y="276" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b949e">alongside the code.</text></g>
