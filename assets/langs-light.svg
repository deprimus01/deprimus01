<svg xmlns="http://www.w3.org/2000/svg" width="440" height="206" viewBox="0 0 440 206" role="img" aria-label="Top languages for deprimus01, generated by a workflow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e4ebf3"/><stop offset=".55" stop-color="#dff0ec"/><stop offset="1" stop-color="#d8cdf0"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121212" stop-opacity=".2"/><stop offset=".5" stop-color="#0f6d42" stop-opacity=".2"/><stop offset="1" stop-color="#0a6f4d" stop-opacity=".26"/></linearGradient>
    <linearGradient id="mintline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f6d42"/><stop offset="1" stop-color="#1c825d"/></linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121212"/><stop offset="1" stop-color="#1b3459"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1c825d"/><stop offset="1" stop-color="#400ae0"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#0a6f4d" stop-opacity=".18"/><stop offset="1" stop-color="#0a6f4d" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="440" height="206" rx="22"/></clipPath>
  </defs>
  <style>
    .in{animation:in .8s cubic-bezier(.2,.7,.2,1) backwards} @keyframes in{from{opacity:0;transform:translateY(8px)}}
    .grow{transform-box:fill-box;transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) backwards} @keyframes grow{from{transform:scaleX(0)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#c)"><rect width="440" height="206" fill="url(#bg)"/><rect width="440" height="206" fill="url(#glow)"/></g>
  <rect x=".75" y=".75" width="438.5" height="204.5" rx="21.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <path d="M30 .75 H410" stroke="#0f6d42" stroke-opacity=".3"/>
  <text x="24" y="42" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="23" font-weight="700" fill="#0d1424">Top languages</text>
  <text x="24" y="60" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#76869c">by code volume</text>
  <text x="24" y="112" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#222f46">Language data appears after the first</text><text x="24" y="134" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#222f46">“Update profile” workflow run.</text><text x="24" y="170" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#1db075">Actions → Update profile → Run workflow</text>
</svg>
