<svg xmlns="http://www.w3.org/2000/svg" width="900" height="96" viewBox="0 0 900 96" role="img" aria-label="Software Developer. Full-stack apps, APIs and databases.">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e4ebf3"/><stop offset=".55" stop-color="#dff0ec"/><stop offset="1" stop-color="#d8cdf0"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121212" stop-opacity=".2"/><stop offset=".5" stop-color="#0f6d42" stop-opacity=".2"/><stop offset="1" stop-color="#0a6f4d" stop-opacity=".26"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c825d"/><stop offset="1" stop-color="#400ae0"/></linearGradient>
    <linearGradient id="mintline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f6d42"/><stop offset="1" stop-color="#1c825d"/></linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121212"/><stop offset="1" stop-color="#1b3459"/></linearGradient><clipPath id="c"><rect width="900" height="96" rx="22"/></clipPath>
  <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#0a6f4d" stop-opacity=".16"/><stop offset="1" stop-color="#0a6f4d" stop-opacity="0"/></radialGradient></defs>
  <style>.in{animation:in .9s cubic-bezier(.2,.7,.2,1) backwards}@keyframes in{from{opacity:0;transform:translateY(8px)}}.dot{animation:p 2.2s ease-in-out infinite}@keyframes p{50%{opacity:.3}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <g clip-path="url(#c)"><rect width="900" height="96" fill="url(#bg)"/><rect width="900" height="96" fill="url(#glow)"/></g>
  <rect x=".75" y=".75" width="898.5" height="94.5" rx="21.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <g class="in"><text x="32" y="44" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="24" font-weight="700" fill="#0d1424">Software Developer</text>
  <text x="32" y="68" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#666f7a">Full-stack apps · APIs · Databases · Video and visual design</text></g>
  <g class="in" style="animation-delay:.2s"><circle class="dot" cx="762" cy="52" r="4" fill="#1c825d"/><text x="868" y="56" text-anchor="end" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1c825d">@deprimus01</text></g>
