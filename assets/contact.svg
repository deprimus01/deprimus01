<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" viewBox="0 0 640 290" role="img" aria-label="Want to build something together? Say hello.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05080b"/><stop offset=".55" stop-color="#08110f"/><stop offset="1" stop-color="#110a22"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".2"/><stop offset=".5" stop-color="#a7f3d0" stop-opacity=".2"/><stop offset="1" stop-color="#10b981" stop-opacity=".26"/></linearGradient>
    <linearGradient id="mintline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a7f3d0"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="1" r="1"><stop offset="0" stop-color="#34d399" stop-opacity=".15"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="640" height="290" rx="26"/></clipPath>
  </defs>
  <style>.in{animation:in .8s cubic-bezier(.2,.7,.2,1) backwards}@keyframes in{from{opacity:0;transform:translateY(8px)}}.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) .3s backwards}@keyframes grow{from{transform:scaleX(0)}}.dot{animation:p 2.2s ease-in-out infinite}@keyframes p{50%{opacity:.35}}.border{animation:trace 12s linear infinite}@keyframes trace{to{stroke-dashoffset:-100}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <g clip-path="url(#c)"><rect width="640" height="290" fill="url(#bg)"/><rect width="640" height="290" fill="url(#glow)"/></g>
  <rect class="border" x="1" y="1" width="638" height="288" rx="25" fill="none" stroke="#34d399" stroke-opacity=".7" stroke-width="2" pathLength="100" stroke-dasharray="4 96"/>
  <rect x=".75" y=".75" width="638.5" height="288.5" rx="25.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<g class="in"><text x="36" y="84" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="700" fill="#f4f6fb">Want to build</text><text x="36" y="130" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="700" fill="#f4f6fb">something together?</text><text x="36" y="176" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" fill="#c3cdda">Have an idea or a project in mind?</text><text x="36" y="204" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" fill="#c3cdda">Say hello and let’s talk it through.</text></g><g class="in" style="animation-delay:.25s"><rect x="36" y="226" width="190" height="46" rx="23" fill="#34d399"/><text x="131" y="256" text-anchor="middle" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#04140e">Say hello →</text></g><g opacity=".95"><circle cx="520" cy="96" r="58" fill="none" stroke="#34d399" stroke-opacity=".4" stroke-dasharray="2 8"/><circle cx="520" cy="96" r="38" fill="none" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.6"/><g transform="translate(502,78) scale(1.5)" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></g></g>
</svg>
