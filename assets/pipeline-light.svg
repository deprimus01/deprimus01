<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760" role="img" aria-label="How I build: users, a Next.js and React frontend, a Node.js and Express API, a PostgreSQL database with Prisma, with Git and GitHub for version control and Vercel and Render for deployment">
