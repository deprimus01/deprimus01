<svg xmlns="http://www.w3.org/2000/svg" width="640" height="236" viewBox="0 0 640 236" role="img" aria-label="Top languages for deprimus01, generated by a workflow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05080b"/><stop offset=".55" stop-color="#08110f"/><stop offset="1" stop-color="#110a22"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".2"/><stop offset=".5" stop-color="#a7f3d0" stop-opacity=".2"/><stop offset="1" stop-color="#10b981" stop-opacity=".26"/></linearGradient>
    <linearGradient id="mintline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a7f3d0"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9cdea"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#10b981" stop-opacity=".18"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="640" height="236" rx="26"/></clipPath>
  </defs>
  <style>
    .in{animation:in .8s cubic-bezier(.2,.7,.2,1) backwards} @keyframes in{from{opacity:0;transform:translateY(8px)}}
    .grow{transform-box:fill-box;transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) backwards} @keyframes grow{from{transform:scaleX(0)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#c)"><rect width="640" height="236" fill="url(#bg)"/><rect width="640" height="236" fill="url(#glow)"/></g>
  <rect x=".75" y=".75" width="638.5" height="234.5" rx="25.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <path d="M36 .75 H604" stroke="#a7f3d0" stroke-opacity=".3"/>
  <text x="32" y="56" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="34" font-weight="700" fill="#f4f6fb">Top languages</text>
  <text x="32" y="86" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="20" fill="#a3adbb">by code volume</text>
  <g class="in"><text x="32" y="140" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="22" fill="#e8edf5">Language data appears after the first</text><text x="32" y="172" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="22" fill="#e8edf5">“Update profile” workflow run.</text><text x="32" y="212" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#a3adbb">Actions → Update profile → Run workflow</text></g>
