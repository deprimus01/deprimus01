<svg xmlns="http://www.w3.org/2000/svg" width="640" height="214" viewBox="0 0 640 214" role="img" aria-label="Build. Learn. Improve. Building practical software, one commit at a time.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f8fa"/><stop offset=".55" stop-color="#e9f5f0"/><stop offset="1" stop-color="#eee9f9"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1424" stop-opacity=".2"/><stop offset=".5" stop-color="#0b6b45" stop-opacity=".2"/><stop offset="1" stop-color="#0a6f4d" stop-opacity=".26"/></linearGradient>
    <linearGradient id="mintline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b6b45"/><stop offset="1" stop-color="#0b7a52"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b7a52"/><stop offset="1" stop-color="#6338d6"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1"><stop offset="0" stop-color="#0b7a52" stop-opacity=".15"/><stop offset="1" stop-color="#0b7a52" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="640" height="214" rx="26"/></clipPath>
  </defs>
  <style>.in{animation:in .8s cubic-bezier(.2,.7,.2,1) backwards}@keyframes in{from{opacity:0;transform:translateY(8px)}}.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) .3s backwards}@keyframes grow{from{transform:scaleX(0)}}.dot{animation:p 2.2s ease-in-out infinite}@keyframes p{50%{opacity:.35}}.border{animation:trace 12s linear infinite}@keyframes trace{to{stroke-dashoffset:-100}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <g clip-path="url(#c)"><rect width="640" height="214" fill="url(#bg)"/><rect width="640" height="214" fill="url(#glow)"/></g>
  
  <rect x=".75" y=".75" width="638.5" height="212.5" rx="25.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<g class="in"><text x="320" y="84" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="42" font-weight="700" fill="#0d1424">Build. Learn. Improve.</text><text x="320" y="124" text-anchor="middle" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="22" fill="#344054">Building practical software,</text><text x="320" y="154" text-anchor="middle" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="22" fill="#344054">one commit at a time.</text><rect class="grow" x="230" y="172" width="180" height="3" rx="1.5" fill="url(#mintline)" style="transform-origin:center"/><text x="320" y="200" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" fill="#475467">@deprimus01</text></g>
</svg>
