name: Update profile

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/profile_stats.py"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pulls real numbers from the GitHub API and redraws the stat cards.
      - name: Generate stats cards and recent repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python .github/scripts/profile_stats.py

      - name: Commit changes
        run: |
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add -- README.md assets/stats.svg assets/stats-light.svg assets/langs.svg assets/langs-light.svg
          git diff --cached --quiet || (git commit -m "chore: refresh profile stats" && git pull --rebase --autostash && git push)
